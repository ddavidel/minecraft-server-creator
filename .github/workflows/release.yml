name: Release

# Manually triggered release from main:
#   1. runs the test suite (release is aborted if any test fails)
#   2. bumps the version, commits it and creates a git tag
#   3. builds the package and creates a GitHub release with the artifacts
#   4. publishes the package to PyPI (Trusted Publishing, no API token needed)
#   5. builds, signs and attaches the Windows installer (installer.yml)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if 'version' is set)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version to release (e.g. 1.2.3). Leave empty to use the bump type."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -v

  release:
    name: Create release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib

          with open("pyproject.toml", "rb") as f:
              current = tomllib.load(f)["project"]["version"]

          explicit = os.environ.get("EXPLICIT_VERSION", "").strip().lstrip("v")
          if explicit:
              if not re.fullmatch(r"\d+\.\d+\.\d+", explicit):
                  sys.exit(f"Invalid version '{explicit}', expected MAJOR.MINOR.PATCH")
              new = explicit
          else:
              major, minor, patch = (int(x) for x in current.split("."))
              bump = os.environ["BUMP"]
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              new = f"{major}.{minor}.{patch}"

          print(f"Current version: {current}")
          print(f"New version:     {new}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={new}\n")
          EOF

      # The notes are written once per release, in the develop -> main PR
      # (scripts/draft_changelog.py makes the draft). Minor/major releases
      # without them are blocked; patches only get a warning.
      - name: Check release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'EOF'
          import json, os, sys, tomllib

          new = os.environ["VERSION"]
          with open("pyproject.toml", "rb") as f:
              current = tomllib.load(f)["project"]["version"]
          path = "src/mcsc_gui/static/changelog.json"
          try:
              with open(path, encoding="utf-8") as f:
                  versions = {r.get("version") for r in json.load(f).get("releases", [])}
          except (OSError, ValueError) as e:
              sys.exit(f"::error::Can't read {path}: {e}")

          if new in versions:
              print(f"Release notes for {new} found")
              sys.exit(0)
          message = (f"No release notes for {new} in {path}. "
                     "Run scripts/draft_changelog.py in the release PR.")
          if new.split(".")[:2] == current.split(".")[:2]:
              print(f"::warning::{message}")  # patch: the app just shows nothing
          else:
              sys.exit(f"::error::{message}")
          EOF

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Update version in pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E "s/^version = \"[^\"]+\"/version = \"${VERSION}\"/" pyproject.toml
          git diff

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          if git diff --cached --quiet; then
            # Releasing the version already in pyproject.toml (e.g. the first release):
            # nothing to bump, just tag the current commit.
            echo "Version is already ${VERSION}, skipping the version bump commit"
          else
            git commit -m "chore(release): v${VERSION}"
            git push origin main
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --generate-notes \
            --verify-tag

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/minecraft-server-creator/${{ needs.release.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # A release created with GITHUB_TOKEN doesn't trigger the `release` event of
  # other workflows, so the installer workflow is called explicitly here.
  installer:
    name: Windows installer
    needs: [release, publish]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/installer.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
