# Builds the Windows installer, signs it with SignPath and attaches it to the
# GitHub release. Setup (one time) is described in installer/README.md.
name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:   # manual run: test-signed installer kept as a workflow artifact, or
                       # with a tag: (re)build that release's installer and attach it
    inputs:
      tag:
        description: "Existing release tag to build and attach the installer to (e.g. v3.0.1). Leave empty for a test build."
        required: false
        type: string
  workflow_call:       # called by release.yml after it creates the release
    inputs:
      tag:
        description: "Release tag to build the installer for (e.g. v3.0.1)"
        required: true
        type: string

permissions:
  contents: write      # upload the installer to the release
  actions: read        # SignPath downloads the unsigned artifact of this run

jobs:
  installer:
    runs-on: windows-latest
    env:
      # set for a real release (release event or call from release.yml), empty for a manual test run
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Check that the release tag matches pyproject.toml
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = $env:RELEASE_TAG.TrimStart('v')
          if ($tag -ne $version) { throw "Release tag $tag doesn't match pyproject version $version" }

      - name: Build installer
        run: python installer/build_installer.py

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: mcsc-setup-unsigned
          path: dist/installer/*.exe
          if-no-files-found: error

      # Signing is optional: without the SignPath settings the installer ships
      # unsigned (Windows SmartScreen warns about an unknown publisher).
      # Releases use the release-signing policy only once the repository
      # variable SIGNPATH_RELEASE_SIGNING is 'true' (it needs a CA certificate);
      # manual runs use test-signing.
      - name: Choose signing policy
        id: policy
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          RELEASE_SIGNING: ${{ vars.SIGNPATH_RELEASE_SIGNING }}
        run: |
          if ($env:HAS_TOKEN -ne 'true' -or -not $env:ORG_ID) {
            $policy = ''
            "::warning::SignPath is not configured: the installer is NOT signed"
          } elseif ($env:RELEASE_TAG -and $env:RELEASE_SIGNING -ne 'true') {
            $policy = ''
            "::warning::Release signing is not enabled (SIGNPATH_RELEASE_SIGNING): the installer is NOT signed"
          } elseif ($env:RELEASE_TAG) {
            $policy = 'release-signing'
          } else {
            $policy = 'test-signing'
          }
          "Signing policy: $(if ($policy) { $policy } else { 'none' })"
          "slug=$policy" >> $env:GITHUB_OUTPUT

      - name: Sign with SignPath
        if: steps.policy.outputs.slug != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.policy.outputs.slug }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # release-signing needs a manual approval in SignPath: give it time
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify signature
        if: steps.policy.outputs.slug != ''
        shell: pwsh
        run: |
          Get-ChildItem signed -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -and $env:RELEASE_TAG) {
              throw "$($_.Name) is not validly signed"
            }
          }

      - name: Upload signed installer
        if: steps.policy.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: mcsc-setup
          path: signed/*.exe
          if-no-files-found: error

      - name: Attach installer to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_DIR: ${{ steps.policy.outputs.slug != '' && 'signed' || 'dist/installer' }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" (Get-ChildItem $env:INSTALLER_DIR -Filter *.exe).FullName --clobber
