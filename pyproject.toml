[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-server-creator"
version = "2.1.2"
description = "Minecraft Server Creator - Manage Minecraft servers"
authors = [{ name = "ddavidel", email = "ddavidel@proton.me" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "nicegui",
    "requests",
    "appdirs",
    "pywebview",
    "pymcsc>=0.1.0",  # server management, imported as `mcsc`
]
requires-python = ">=3.12"

[tool.setuptools]
package-dir = { "" = "src" }

[project.scripts]
mcsc = "mcsc_gui.__main__:main"

[tool.setuptools.package-data]
"mcsc_gui" = ["static/*", "static/**/*"]
