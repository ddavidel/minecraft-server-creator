[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-server-creator"
version = "3.2.0"
description = "Minecraft Server Creator - Manage Minecraft servers"
authors = [{ name = "ddavidel", email = "ddavidel@proton.me" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "requests",
    "appdirs",
    "pymcsc==0.3.1",  # server management, imported as `mcsc` (pinned: bump deliberately after testing)
    "PySide6-Essentials>=6.8",
    "qtawesome",
    "mcstatus==11.1.1",  # online players (Query / Server List Ping), pinned like pymcsc
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-asyncio",
]

[tool.setuptools]
package-dir = { "" = "src" }

[project.scripts]
mcsc = "mcsc_gui.__main__:main"

[tool.setuptools.package-data]
"mcsc_gui" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
